# One service, one package, one member of the workspace named in the repository's root `Cargo.toml`.
# The dependency lock is the workspace's, at the root, because Cargo keeps one per workspace.
[package]
name = "delivery-starter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# What this service depends on follows from what it was generated with; a store's crate sits in that
# store's marked region, so `./init --event-store` takes it out with the adapter.
[dependencies]
__DEPENDENCIES__

[lints]
workspace = true
